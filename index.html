<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFClite Federation</title>
  </head>
  <body>
    <div id="app">
      <header>
        <strong>IFC Federation</strong>
      </header>
      <main>
        <canvas id="viewer" aria-label="Federated IFC models"></canvas>
        <section id="selection" aria-label="Selected element" hidden></section>
        <div id="status" role="status" aria-live="polite">Waiting for Grist data…</div>
      </main>
      <div id="error" role="alert" hidden></div>
    </div>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
